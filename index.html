:root{--bg:#090B10;--ink:#E9E6DF;--mute:#7C8394;--line:#1C2130}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:NS,'Noto Sans',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100%;background:radial-gradient(ellipse at 50% 55%,#121827 0%,#090B10 62%)}
.wrap{width:min(420px,88vw);text-align:center}
.orb{width:120px;height:120px;margin:0 auto 34px;position:relative}
.orb span{position:absolute;inset:0;border:1px solid #2A3144;border-radius:50%}
.orb span:nth-child(2){inset:22px;border-color:#3A4258}
.orb span:nth-child(3){inset:48px;background:#E9E6DF;border:none;box-shadow:0 0 24px rgba(233,230,223,.45)}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
h1{font-family:NSerif,'Noto Serif',Georgia,serif;font-style:italic;font-weight:300;font-size:40px;line-height:1.1;margin:12px 0 30px;color:#F1EEE8}
form{display:flex;gap:10px}
input{flex:1;min-width:0;background:#0F131C;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:14px 16px;font:16px NS,system-ui,sans-serif;outline:none}
input:focus{border-color:#4A5470}
button{background:#E9E6DF;color:#090B10;border:0;border-radius:10px;padding:0 20px;font:600 15px NS,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#msg{min-height:20px;margin-top:16px;font-size:13px;color:var(--mute)}
#msg.err{color:#D98B7E}
</style></head>

    const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:u(P.salt),iterations:P.iter},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},key,u(P.ct));
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(err){
    msg.className='err'; msg.textContent='Wrong password.'; pw.value=''; pw.focus(); go.disabled=false;
  }
});
</script>
